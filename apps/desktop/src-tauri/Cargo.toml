[package]
name = "contexa"
version.workspace = true
description = "Contexa — AI Context Platform"
authors = ["Contexa"]
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "contexa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
contexa-core = { path = "../../../crates/contexa-core" }
contexa-vision = { path = "../../../crates/contexa-vision" }
contexa-context = { path = "../../../crates/contexa-context" }
contexa-db = { path = "../../../crates/contexa-db" }
contexa-memory = { path = "../../../crates/contexa-memory" }
contexa-prompt = { path = "../../../crates/contexa-prompt" }
contexa-llm = { path = "../../../crates/contexa-llm" }
contexa-search = { path = "../../../crates/contexa-search" }
contexa-orchestrator = { path = "../../../crates/contexa-orchestrator" }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

